<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plus mit Dienes-Material im ZR 100</title>
    <style>
        :root {
            /* Grundeinheit: Kantenlaenge eines Einerwuerfels. Wird je Layout
               (untereinander / nebeneinander) auf dem body ueberschrieben. */
            --u: clamp(12px, 4.1vmin, 50px);

            --wood: #f6e9bd;
            --wood-top: #fbf3d6;
            --edge: #bfa05a;
            --line: rgba(150, 118, 52, 0.55);

            --blue: #2196F3;
            --bg: #f8f9fa;
            --card-bg: #ffffff;
            --ink: #0d0d0d;
        }

        /* Nebeneinander ist Platz nach oben/unten, also groesser zoomen.
           Der 3.6vw-Anteil greift erst in fast quadratischen Fenstern; bei
           16:9 und 4:3 gewinnt vmin, das Beamerbild aendert sich also nicht. */
        body.side-by-side {
            --u: clamp(14px, min(4.4vmin, 3.6vw), 52px);
        }

        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
            user-select: none;
        }

        .main-card {
            position: relative;
            background: var(--card-bg);
            padding: 58px 60px 40px;
            border-radius: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            border: 1px solid rgba(0,0,0,0.05);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-width: calc(var(--u) * 22);
            box-sizing: border-box;
        }

        .title-pill {
            position: absolute;
            top: 0;
            left: 50%;
            transform: translate(-50%, -30%);
            background: var(--blue);
            color: #ffffff;
            font-size: 22px;
            font-weight: 500;
            padding: 10px 32px;
            border-radius: 999px;
            width: fit-content;
            margin: 0;
            white-space: nowrap;
            letter-spacing: 0.3px;
            box-shadow: 0 4px 12px -2px rgba(33,150,243,0.4);
        }

        /* ---------- Buehne mit den beiden Summanden ---------- */

        /* Untereinander: Der ganze Block bekommt eine feste Hoehe, damit die
           Gleichung darunter bei jeder Aufgabe an derselben Stelle steht.
           Gemessenes Maximum ueber alle Aufgaben: 12.72u (10 + 81), hier
           12.9u reserviert. */
        .board {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            justify-content: center;
            gap: calc(var(--u) * 0.6);
            height: calc(var(--u) * 12.9);
        }

        .stage {
            width: calc(var(--u) * 10 + 4px);
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            justify-content: flex-end;
        }

        /* Nebeneinander: jeder Summand bekommt eine feste Hoehe fuer
           hoechstens 8 Stangen + Fuenferluecke + Einerreihe (gemessenes
           Maximum ueber alle Aufgaben: 10.41u, hier 10.6u reserviert). */
        body.side-by-side .board {
            flex-direction: row;
            align-items: flex-end;
            gap: calc(var(--u) * 2.2);
            height: auto;
        }

        body.side-by-side .stage {
            height: calc(var(--u) * 10.6);
        }

        /* Trennlinie zwischen den Summanden */
        .board .divider {
            align-self: stretch;
            background: #d9d9d9;
            border-radius: 2px;
            height: 3px;
            width: auto;
        }

        body.side-by-side .board .divider {
            width: 3px;
            height: auto;
        }

        /* ---------- Dienes-Material ---------- */

        .rods {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        /* Luecke nach der 5. Stange (Kraft der Fuenf) */
        .rods .rod:nth-child(6) {
            margin-top: calc(var(--u) * 0.5);
        }

        .rod, .cube {
            background-color: var(--wood);
            border: 1.5px solid var(--edge);
            border-radius: 4px;
            box-sizing: border-box;
            box-shadow: inset 0 calc(var(--u) * 0.18) 0 rgba(255,255,255,0.55);
        }

        .rod {
            width: calc(var(--u) * 10);
            height: var(--u);
            background-image: repeating-linear-gradient(
                to right,
                var(--line) 0 1.5px,
                transparent 1.5px var(--u)
            );
        }

        .cube {
            width: var(--u);
            height: var(--u);
            flex: 0 0 auto;
        }

        /* Einerwuerfel liegen leicht unordentlich aneinander */
        .ones {
            display: flex;
            align-items: flex-end;
            margin-top: 2px;
            padding-top: calc(var(--u) * 0.1);
            height: calc(var(--u) * 1.25);
        }

        /* ---------- Gleichung ---------- */

        .equation {
            margin-top: calc(var(--u) * 0.9);
            font-size: calc(var(--u) * 1.9);
            font-weight: 500;
            color: var(--ink);
            display: flex;
            align-items: baseline;
            gap: calc(var(--u) * 0.5);
            white-space: nowrap;
        }

        .equation .slot {
            display: inline-block;
            min-width: calc(var(--u) * 3.2);
            text-align: center;
            border-bottom: 4px solid #444;
            padding: 0 calc(var(--u) * 0.2);
            line-height: 1.1;
            /* Vorgegebene Zahlen gehoeren zur Aufgabenstellung: schwarz. */
            color: var(--ink);
            font-weight: 500;
        }

        /* Aufgedeckte Zahlen blau und fett, klar abgesetzt von der Vorgabe. */
        .equation .slot.solved {
            color: var(--blue);
            font-weight: 700;
        }

        .equation .slot:empty::before {
            content: '\00a0';
        }

        /* Im Textfluss unter der Karte statt am Bildrand: bei 1280x720 lag
           der Chip sonst auf der unteren Kartenkante. */
        .footer-hint {
            margin-top: 18px;
            font-size: 16px;
            color: #aaa;
            background: rgba(0,0,0,0.03);
            padding: 8px 20px;
            border-radius: 20px;
            max-width: 96vw;
            text-align: center;
            line-height: 1.5;
        }

        /* Jede Gruppe bleibt am Stueck. Muss die Zeile doch einmal umbrechen,
           rutscht eine ganze Gruppe nach unten und nie ein einzelnes Wort. */
        .footer-hint .hint-group {
            white-space: nowrap;
        }

        .footer-hint .hint-sep {
            margin: 0 6px;
            color: #ccc;
        }

        .footer-hint b { color: #888; }

        .fade-in { animation: fadeIn 0.35s ease-out; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to   { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="main-card">
        <div class="title-pill">Plus mit Dienes-Material</div>

        <div class="board" id="board">
            <div class="stage"><div id="material-a"></div></div>
            <div class="divider"></div>
            <div class="stage"><div id="material-b"></div></div>
        </div>

        <div class="equation">
            <span class="slot" id="slot-a"></span>
            <span>+</span>
            <span class="slot" id="slot-b"></span>
            <span>=</span>
            <span class="slot" id="slot-sum"></span>
        </div>
    </div>

    <div class="footer-hint">
        <span class="hint-group"><b>&rarr;</b> bzw. <b>Leertaste</b>: L&ouml;sung / n&auml;chste Aufgabe</span>
        <span class="hint-sep">&middot;</span>
        <span class="hint-group"><b>&uarr;</b> Aufgabenart: <span id="level-label"></span></span>
        <span class="hint-sep">&middot;</span>
        <span class="hint-group"><b>&darr;</b> Anordnung: <span id="layout-label"></span></span>
        <span class="hint-sep">&middot;</span>
        <span class="hint-group"><b>&larr;</b> Vorgabe: <span id="prefill-label"></span></span>
        <span class="hint-sep">&middot;</span>
        <span class="hint-group"><b>S</b> Aufdecken: <span id="reveal-label"></span></span>
    </div>

    <script>
    /* ------------------------------------------------------------------
       Schwierigkeitsstufen (Pfeil nach oben schaltet rotierend durch)
       Jede Stufe zaehlt in pairs() alle erlaubten Aufgaben auf; ausgewaehlt
       wird spaeter ueber das Ergebnis, nicht ueber die Summanden.

       Warum: Zieht man erst a und dann b aus dem Rest bis 100, wird der
       verbleibende Topf fuer b mit wachsendem a immer kleiner - der jeweils
       groesstmoegliche Wert bekommt dadurch immer mehr Gewicht. Bei a = 90
       bleibt nur b = 10. Ergebnis war: 31 % aller Z+Z-Aufgaben waren 100 und
       die Haelfte lag ueber 80. Auch gleichverteiltes Ziehen ueber alle
       Zahlenpaare hilft nicht, denn 100 hat neun Zerlegungen und 20 nur eine.
       ------------------------------------------------------------------ */

    const LEVELS = [
        {
            id: 'z-plus-z',
            name: 'Z + Z',
            pairs() {
                // Zehnerzahl + Zehnerzahl, Summe <= 100
                const list = [];
                for (let a = 10; a <= 90; a += 10) {
                    for (let b = 10; a + b <= 100; b += 10) list.push({ a: a, b: b });
                }
                return list;
            }
        },
        {
            id: 'z-plus-ze',
            name: 'Z + ZE',
            pairs() {
                // Zehnerzahl + zweistellige Zahl mit Einern (E != 0), Summe <= 99
                const list = [];
                for (let a = 10; a <= 80; a += 10) {
                    for (let bTens = 10; bTens <= 90; bTens += 10) {
                        for (let bOnes = 1; bOnes <= 9; bOnes++) {
                            const b = bTens + bOnes;
                            if (a + b <= 99) list.push({ a: a, b: b });
                        }
                    }
                }
                return list;
            }
        }
    ];

    const LAYOUTS = [
        { id: 'stacked',      name: 'untereinander' },
        { id: 'side-by-side', name: 'nebeneinander' }
    ];

    /* Wie viele Summanden stehen schon in der Gleichung, bevor aufgeloest wird?
       Pfeil nach links schaltet rotierend durch. */
    const PREFILLS = [
        { count: 1, name: 'erste Zahl' },
        { count: 2, name: 'beide Zahlen' },
        { count: 0, name: 'keine Zahl' }
    ];

    /* ------------------------------------------------------------------
       Aufgabenauswahl

       Gezogen wird in zwei Schritten: erst das Ergebnis, dann eine seiner
       Zerlegungen. So ist jedes Ergebnis gleich haeufig, statt dass die
       grossen Ergebnisse ihre vielen Zerlegungen zusammenzaehlen.

       Die Ergebnisse kommen aus einem Beutel ohne Zuruecklegen: erst wenn
       alle dran waren, wird neu gemischt. Das verhindert Zufallshaeufungen
       wie dreimal 100 hintereinander und macht die Verteilung schon
       innerhalb einer Sitzkreisrunde gleichmaessig.
       ------------------------------------------------------------------ */

    function shuffle(list) {
        for (let i = list.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            const tmp = list[i]; list[i] = list[j]; list[j] = tmp;
        }
        return list;
    }

    LEVELS.forEach((level) => {
        level.bySum = new Map();
        level.pairs().forEach((pair) => {
            const sum = pair.a + pair.b;
            if (!level.bySum.has(sum)) level.bySum.set(sum, []);
            level.bySum.get(sum).push(pair);
        });
        level.results = Array.from(level.bySum.keys());
        level.bag = [];
    });

    function drawTask(level, previous) {
        if (level.bag.length === 0) {
            level.bag = shuffle(level.results.slice());
            // Beim Nachfuellen darf das letzte Ergebnis nicht sofort wieder
            // als erstes kommen.
            const last = level.bag[level.bag.length - 1];
            if (previous && level.bag.length > 1 && last === previous.a + previous.b) {
                level.bag[level.bag.length - 1] = level.bag[0];
                level.bag[0] = last;
            }
        }

        const sum = level.bag.pop();
        const options = level.bySum.get(sum);
        let pair = options[Math.floor(Math.random() * options.length)];
        if (previous && options.length > 1 && pair.a === previous.a && pair.b === previous.b) {
            pair = options[Math.floor(Math.random() * options.length)];
        }
        return { a: pair.a, b: pair.b };
    }

    /* ------------------------------------------------------------------
       Dienes-Material zeichnen
       ------------------------------------------------------------------ */

    function el(tag, className) {
        const node = document.createElement(tag);
        if (className) node.className = className;
        return node;
    }

    function renderNumber(n) {
        const wrap = el('div', 'fade-in');
        const tens = Math.floor(n / 10);
        const ones = n % 10;

        if (tens > 0) {
            const rods = el('div', 'rods');
            for (let i = 0; i < tens; i++) rods.appendChild(el('div', 'rod'));
            wrap.appendChild(rods);
        }

        if (ones > 0) {
            const row = el('div', 'ones');
            for (let i = 0; i < ones; i++) {
                const cube = el('div', 'cube');
                // leicht unperfekt aneinandergelegt
                const rot   = (Math.random() * 6 - 3).toFixed(2);
                const shift = (Math.random() * 0.16 - 0.05).toFixed(3);
                const drop  = (Math.random() * 0.12).toFixed(3);
                cube.style.transform = 'rotate(' + rot + 'deg) translateY(calc(var(--u) * ' + drop + '))';
                cube.style.marginLeft = (i === 0 ? '0' : 'calc(var(--u) * ' + shift + ')');
                row.appendChild(cube);
            }
            wrap.appendChild(row);
        }

        return wrap;
    }

    /* ------------------------------------------------------------------
       Ablauf
       ------------------------------------------------------------------ */

    let levelIndex = 0;
    let layoutIndex = 0;
    let prefillIndex = 0;
    let stepwise = false;
    let currentTask = null;

    // Reihenfolge, in der schrittweise aufgedeckt wird.
    const REVEAL_ORDER = ['a', 'b', 'sum'];

    // Welche Platzhalter sind bereits aufgedeckt (blau)? Vorgegebene Zahlen
    // stehen hier nicht drin, die kommen aus der Vorgabe-Stufe.
    let revealed = new Set();

    const materialA = document.getElementById('material-a');
    const materialB = document.getElementById('material-b');
    const slots = {
        a:   document.getElementById('slot-a'),
        b:   document.getElementById('slot-b'),
        sum: document.getElementById('slot-sum')
    };
    const levelLabel   = document.getElementById('level-label');
    const layoutLabel  = document.getElementById('layout-label');
    const prefillLabel = document.getElementById('prefill-label');
    const revealLabel  = document.getElementById('reveal-label');

    function taskValues() {
        return {
            a:   String(currentTask.a),
            b:   String(currentTask.b),
            sum: String(currentTask.a + currentTask.b)
        };
    }

    /* Welche Platzhalter sind durch die Vorgabe-Stufe schon gefuellt? */
    function givenSlots() {
        const count = PREFILLS[prefillIndex].count;
        return { a: count >= 1, b: count >= 2, sum: false };
    }

    /* Zeichnet die Gleichung neu: vorgegebene Zahlen schwarz, bereits
       aufgedeckte blau, der Rest leer. */
    function renderSlots() {
        const values = taskValues();
        const given = givenSlots();

        for (const key in slots) {
            const show = given[key] || revealed.has(key);
            slots[key].textContent = show ? values[key] : '';
            slots[key].classList.remove('fade-in');
            slots[key].classList.toggle('solved', show && !given[key]);
        }
    }

    /* Noch leere Platzhalter in Aufdeckreihenfolge. Entscheidend ist der
       tatsaechliche Zustand, nicht die Zahl der Tastendruecke - deshalb
       stimmt die Anzahl der Schritte bei jeder Vorgabe-Stufe automatisch. */
    function openSlots() {
        const given = givenSlots();
        return REVEAL_ORDER.filter((key) => !given[key] && !revealed.has(key));
    }

    function fillSlot(key) {
        slots[key].textContent = taskValues()[key];
        slots[key].classList.add('solved');
        void slots[key].offsetWidth;
        slots[key].classList.add('fade-in');
        revealed.add(key);
    }

    function newTask() {
        currentTask = drawTask(LEVELS[levelIndex], currentTask);
        const task = currentTask;

        materialA.innerHTML = '';
        materialB.innerHTML = '';
        materialA.appendChild(renderNumber(task.a));
        materialB.appendChild(renderNumber(task.b));

        revealed = new Set();
        renderSlots();
    }

    /* Ein Druck auf Pfeil nach rechts: schrittweise nur der naechste leere
       Platzhalter, sonst alle auf einmal. Schon sichtbare Zahlen werden nie
       neu gesetzt, damit das Tafelbild nicht springt. */
    function reveal() {
        const open = openSlots();
        if (open.length === 0) return;
        (stepwise ? open.slice(0, 1) : open).forEach(fillSlot);
    }

    function applyLayout() {
        const layout = LAYOUTS[layoutIndex];
        document.body.classList.toggle('side-by-side', layout.id === 'side-by-side');
        layoutLabel.textContent = layout.name;
    }

    function updateLevelLabel() {
        levelLabel.textContent = LEVELS[levelIndex].name;
    }

    function updatePrefillLabel() {
        prefillLabel.textContent = PREFILLS[prefillIndex].name;
    }

    function updateRevealLabel() {
        revealLabel.textContent = stepwise ? 'schrittweise' : 'alles auf einmal';
    }

    window.addEventListener('keydown', (e) => {
        // Die Leertaste wirkt wie Pfeil nach rechts: Sie ist der reflexhafte
        // Weiter-Knopf und der Vorwaertsknopf vieler Praesentationsfernbedienungen.
        const forward = e.key === 'ArrowRight' || e.key === ' ' || e.key === 'Spacebar';

        if (forward) {
            e.preventDefault();
            if (openSlots().length === 0) newTask();
            else reveal();
        } else if (e.key === 'ArrowUp') {
            e.preventDefault();
            levelIndex = (levelIndex + 1) % LEVELS.length;
            updateLevelLabel();
            currentTask = null;
            newTask();
        } else if (e.key === 'ArrowDown') {
            e.preventDefault();
            // Nur die Anordnung wechseln, die Aufgabe bleibt stehen.
            layoutIndex = (layoutIndex + 1) % LAYOUTS.length;
            applyLayout();
        } else if (e.key === 'ArrowLeft') {
            e.preventDefault();
            // Vorgabe umschalten; die Aufgabe bleibt stehen. Was schon
            // aufgedeckt war, bleibt sichtbar und wechselt nur die Farbe.
            prefillIndex = (prefillIndex + 1) % PREFILLS.length;
            updatePrefillLabel();
            renderSlots();
        } else if (e.key.toLowerCase() === 's') {
            // Buchstabe statt Sondertaste: Auf iPad-Huellentastaturen sitzen
            // gerade die Sondertasten an ungewohnten Stellen.
            e.preventDefault();
            stepwise = !stepwise;
            updateRevealLabel();
        }
    });

    applyLayout();
    updateLevelLabel();
    updatePrefillLabel();
    updateRevealLabel();
    newTask();
    </script>
</body>
</html>
