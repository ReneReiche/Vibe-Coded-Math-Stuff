<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plus mit Zehnern und Einern im ZR 100</title>
    <style>
        :root {
            /* Grundeinheit: Kantenlaenge eines Einerwuerfels. Mit
               eingeblendeten Zwischenschritten etwas kleiner, damit die
               zusaetzliche Zeile noch ins Beamerbild passt. */
            --u: clamp(12px, min(3.85vmin, 3.4vw), 47px);

            --wood: #f6e9bd;
            --edge: #bfa05a;
            --line: rgba(150, 118, 52, 0.55);

            --blue: #2196F3;
            --bg: #f8f9fa;
            --card-bg: #ffffff;
            --ink: #0d0d0d;
        }

        body.show-steps {
            --u: clamp(12px, min(3.35vmin, 2.95vw), 41px);
        }

        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
            user-select: none;
        }

        .main-card {
            position: relative;
            background: var(--card-bg);
            padding: 58px 60px 40px;
            border-radius: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            border: 1px solid rgba(0,0,0,0.05);
            display: flex;
            flex-direction: column;
            align-items: center;
            box-sizing: border-box;
        }

        /* Handy-Vorschau: sonst ragt die Karte links und rechts aus dem Bild. */
        @media (max-width: 600px) {
            .main-card { padding-left: 20px; padding-right: 20px; }
        }

        .title-pill {
            position: absolute;
            top: 0;
            left: 50%;
            transform: translate(-50%, -30%);
            background: var(--blue);
            color: #ffffff;
            font-size: 22px;
            font-weight: 500;
            padding: 10px 32px;
            border-radius: 999px;
            width: fit-content;
            margin: 0;
            white-space: nowrap;
            letter-spacing: 0.3px;
            box-shadow: 0 4px 12px -2px rgba(33,150,243,0.4);
        }

        /* ---------- Spalten wie in der Stellentafel ----------
           Material und Zwischenschritte teilen sich dasselbe Raster: links
           die Zehnerspalte, rechts die Einerspalte. Auch ein Summand ohne
           Zehner behaelt seine leere Zehnerspalte - sonst rutschen seine
           Einer nach links unter die Stangen, und genau die Ordnung, um die
           es auf dieser Seite geht, waere weg. */
        .columns {
            display: grid;
            /* Einerspalte: 9 Wuerfel + Fuenferluecke + Jitter */
            grid-template-columns: calc(var(--u) * 10) calc(var(--u) * 10);
            column-gap: calc(var(--u) * 0.8);
        }

        /* Feste Hoehe, damit Zwischenschritte und Gleichung bei jeder
           Aufgabe an derselben Stelle stehen. Hoechster Fall ueber alle
           Stufen: 9 Stangen + Fuenferluecke, darunter eine Einerreihe
           (90er-Zahl + E) = 9.5u + 1.7u Abstand + 1u = 12.2u + 16px Fugen,
           dazu der Jitter der Wuerfel. */
        /* Taste M: Material ausblenden, damit eine Runde nur mit Zahlen
           gerechnet wird. Die Buehne behaelt ihren Platz, damit Gleichung
           und Zwischenschritte nicht springen. */
        body.no-material .stage { opacity: 0; }

        .stage {
            transition: opacity 250ms ease;
            height: calc(var(--u) * 12.4 + 18px);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Deutlich mehr als die Fuenferluecke (0.5u) innerhalb eines
           Summanden, sonst sehen fuenf plus drei Stangen wie ein Summand aus. */
        .board {
            row-gap: calc(var(--u) * 1.7);
        }

        /* Einer liegen rechts neben den Zehnern, auf Hoehe der obersten
           Stange - wie im Schulbuch. Bewusst anders als die anderen
           Dienes-Seiten (dort die unterste Stange), auf Renes Wunsch. */
        .board > div {
            align-self: start;
        }

        /* ---------- Dienes-Material ---------- */

        .rods {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        /* Luecke nach der 5. Stange (Kraft der Fuenf) */
        .rods .rod:nth-child(6) {
            margin-top: calc(var(--u) * 0.5);
        }

        .rod, .cube {
            background-color: var(--wood);
            border: 1.5px solid var(--edge);
            border-radius: 4px;
            box-sizing: border-box;
            box-shadow: inset 0 calc(var(--u) * 0.18) 0 rgba(255,255,255,0.55);
        }

        .rod {
            width: calc(var(--u) * 10);
            height: var(--u);
            background-image: repeating-linear-gradient(
                to right,
                var(--line) 0 1.5px,
                transparent 1.5px var(--u)
            );
        }

        .cube {
            width: var(--u);
            height: var(--u);
            flex: 0 0 auto;
            transform: rotate(var(--rot, 0deg))
                       translateY(calc(var(--u) * var(--drop, 0)));
        }

        /* Einerwuerfel liegen leicht unordentlich aneinander */
        .ones {
            display: flex;
            align-items: flex-end;
            height: var(--u);
        }

        /* ---------- Zwischenschritte: Zehner extra, Einer extra ----------
           Jede Rechnung steht unter ihrer eigenen Spalte. Bewusst deutlich
           kleiner als die Gleichung und mit normalen Abstaenden:
           zusammengedraengt lasen sich Zehner- und Einerrechnung wie eine
           einzige lange Zeile. Der Sitzkreis ist nah genug an der Tafel,
           dass auch diese Groesse noch gut lesbar ist. */
        .steps {
            display: none;
            margin-top: calc(var(--u) * 0.8);
            font-size: calc(var(--u) * 1.05);
            font-weight: 500;
            color: var(--ink);
        }

        body.show-steps .steps { display: grid; }

        .steps > div {
            display: flex;
            align-items: baseline;
            justify-content: center;
            gap: 0.35em;
            white-space: nowrap;
        }

        /* Die Einer liegen links in ihrer Spalte, also steht auch ihre
           Rechnung links - mittig stuende sie bei drei Wuerfeln im Leeren. */
        .steps > div:last-child {
            justify-content: flex-start;
        }

        /* ---------- Platzhalter ---------- */

        .slot {
            display: inline-block;
            text-align: center;
            line-height: 1.1;
            /* Vorgegebene Zahlen gehoeren zur Aufgabenstellung: schwarz. */
            color: var(--ink);
            font-weight: 500;
        }

        /* Aufgedeckte Zahlen blau und fett, klar abgesetzt von der Vorgabe. */
        .slot.solved {
            color: var(--blue);
            font-weight: 700;
        }

        .slot:empty::before {
            content: '\00a0';
        }

        .steps .slot {
            min-width: 1.5em;
            border-bottom: 3px solid #444;
            padding: 0 0.1em;
        }

        /* Blau ist in den Zwischenschritten die Zehnerkarte. Aufgedeckte
           Summanden bleiben dort deshalb schwarz und werden nur fett - wie
           am Rechenstrich. */
        .steps .slot.solved {
            color: var(--ink);
        }

        /* Ein Platzhalter mit Karte braucht keinen Strich mehr. Der Strich
           bleibt unsichtbar stehen, damit die Zeile nicht springt. */
        .steps .slot.as-card,
        .equation .slot.as-card {
            border-bottom-color: transparent;
        }

        /* ---------- Zahlenkarten wie im Heft ---------- */

        .card {
            position: relative;
            display: inline-flex;
            padding: 0.03em 0.12em;
            border: 0.05em solid;
            border-radius: 0.1em;
            color: var(--ink);
            font-weight: 600;
            line-height: 1.15;
            box-shadow: 0 0.04em 0.1em rgba(0,0,0,0.18);
        }

        .card .digit {
            display: inline-block;
            width: 0.62em;
            text-align: center;
        }

        .card.card-z { background: #8cc4f5; border-color: #1e88e5; }
        .card.card-e { background: #f5a39c; border-color: #e53935; }

        /* Die rote Karte deckt die Einerstelle der blauen zu: gleiche
           Polsterung, also genau eine Ziffernzelle weiter rechts, dazu
           der Versatz nach rechts (0.2em) und unten (0.12em), damit man wie im Heft
           sieht, dass darunter eine laengere Karte liegt. */
        .card-stack {
            position: relative;
            display: inline-block;
            font-size: 0.85em;
            margin-right: 0.2em;
        }

        .card-stack .card.card-e {
            position: absolute;
            left: calc(0.62em + 0.2em);
            top: 0.12em;
        }

        .card.slide-in {
            animation: slideIn 420ms cubic-bezier(0.34, 1.5, 0.64, 1) both;
            animation-delay: 150ms;
        }

        @keyframes slideIn {
            from { transform: translate(0.9em, 0.6em); opacity: 0; }
            40%  { opacity: 1; }
            to   { transform: translate(0, 0); opacity: 1; }
        }

        /* ---------- Gleichung ---------- */

        .equation {
            margin-top: calc(var(--u) * 0.8);
            font-size: calc(var(--u) * 1.9);
            font-weight: 500;
            color: var(--ink);
            display: flex;
            align-items: baseline;
            gap: calc(var(--u) * 0.5);
            white-space: nowrap;
        }

        .equation .slot {
            min-width: calc(var(--u) * 3.2);
            border-bottom: 4px solid #444;
            padding: 0 calc(var(--u) * 0.2);
        }

        .footer-hint {
            margin-top: 18px;
            font-size: 16px;
            color: #aaa;
            background: rgba(0,0,0,0.03);
            padding: 8px 20px;
            border-radius: 20px;
            max-width: 96vw;
            text-align: center;
            line-height: 1.5;
        }

        /* Jede Gruppe bleibt am Stueck. Muss die Zeile doch einmal umbrechen,
           rutscht eine ganze Gruppe nach unten und nie ein einzelnes Wort. */
        .footer-hint .hint-group { white-space: nowrap; }
        .footer-hint .hint-sep { margin: 0 6px; color: #ccc; }
        .footer-hint b { color: #888; }

        /* Credit-Zeile: noch kleiner und blasser als die Fusszeile. */
        .credit {
            margin-top: 8px;
            font-size: 11px;
            color: #bbb;
            text-align: center;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        /* 12 x 9 Rasterfelder zu je genau 3 CSS-Pixeln, damit die Figur bei
           100 % Zoom pixelscharf ist. Bewusst ohne shape-rendering. */
        .credit .mascot { width: 36px; height: 27px; opacity: 0.85; }

        .fade-in { animation: fadeIn 0.35s ease-out; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to   { opacity: 1; transform: translateY(0); }
        }
        /* Handy-Vorschau: Wischen steuert die Seite. Zwei Finger duerfen
           weiter zoomen, Doppeltippen zoomt nicht, Herunterziehen laedt
           nicht neu, und Antippen blitzt nicht auf. */
        html, body {
            touch-action: pinch-zoom;
            overscroll-behavior: none;
            -webkit-tap-highlight-color: transparent;
        }
    </style>
</head>
<body>

    <div class="main-card">
        <div class="title-pill">Plus mit Zehnern und Einern</div>

        <div class="stage">
            <div class="board columns" id="board"></div>
        </div>

        <div class="steps columns">
            <div>
                <span class="slot" data-part="aT"></span>
                <span>+</span>
                <span class="slot" data-part="bT"></span>
                <span>=</span>
                <span class="slot" data-part="sT"></span>
            </div>
            <div>
                <span class="slot" data-part="aE"></span>
                <span>+</span>
                <span class="slot" data-part="bE"></span>
                <span>=</span>
                <span class="slot" data-part="sE"></span>
            </div>
        </div>

        <div class="equation">
            <span class="slot" data-part="a"></span>
            <span>+</span>
            <span class="slot" data-part="b"></span>
            <span>=</span>
            <span class="slot" data-part="sum"></span>
        </div>
    </div>

    <div class="footer-hint">
        <span class="hint-group" data-key="ArrowRight"><b>&rarr;</b> bzw. <b>Leertaste</b>: L&ouml;sung / n&auml;chste Aufgabe</span>
        <span class="hint-sep">&middot;</span>
        <span class="hint-group" data-key="ArrowUp"><b>&uarr;</b> Aufgabenart: <span id="level-label"></span></span>
        <span class="hint-sep">&middot;</span>
        <span class="hint-group" data-key="ArrowDown"><b>&darr;</b> Zwischenschritte: <span id="steps-label"></span></span>
        <span class="hint-sep">&middot;</span>
        <span class="hint-group" data-key="ArrowLeft"><b>&larr;</b> Vorgabe: <span id="prefill-label"></span></span>
        <span class="hint-sep">&middot;</span>
        <span class="hint-group" data-key="s"><b>S</b> Aufdecken: <span id="reveal-label"></span></span>
        <span class="hint-sep">&middot;</span>
        <span class="hint-group" data-key="m"><b>M</b> Material: <span id="material-label"></span></span>
    </div>
    <!-- Herkunft: erstellt mit Claude Opus 5.5 (28.09.2026). Darstellung nach Renés Vorlage aus dem Schulbuch: beide Summanden untereinander, Zehner links, Einer rechts. -->
    <div class="credit">
        Idee und Didaktik: Ren&eacute; Reiche &middot; Code: Claude Opus 5.5
        <!-- Claw'd, das Claude-Code-Maskottchen, als Pixelfigur auf einem
             12 x 9-Raster. Inline-SVG, damit die Seite assetfrei bleibt. -->
        <svg class="mascot" viewBox="0 0 12 9" aria-hidden="true">
            <g fill="#d97757">
                <rect x="3" y="1" width="7" height="5"/>
                <rect x="1" y="2" width="2" height="2"/>
                <rect x="10" y="2" width="2" height="2"/>
                <rect x="3" y="6" width="1" height="2"/>
                <rect x="5" y="6" width="1" height="2"/>
                <rect x="7" y="6" width="1" height="2"/>
                <rect x="9" y="6" width="1" height="2"/>
            </g>
            <rect x="4" y="2" width="1" height="1" fill="#1a1a1a"/>
            <rect x="8" y="2" width="1" height="1" fill="#1a1a1a"/>
        </svg>
    </div>

    <script>
    /* ------------------------------------------------------------------
       Schwierigkeitsstufen (Pfeil nach oben schaltet rotierend durch)

       Alle Stufen bleiben ohne Zehneruebergang: die Einer zusammen sind
       hoechstens 9. Nur so gilt, was die Kinder hier entdecken sollen -
       Zehner und Einer lassen sich getrennt addieren und stehen danach
       genau so im Ergebnis.

       ZE + Z und ZE + E sind die Gegenstuecke dazu: dort aendert sich nur
       eine Spalte, und die andere wird unveraendert abgeschrieben.
       ------------------------------------------------------------------ */

    const LEVELS = [
        {
            id: 'ze-plus-ze',
            name: 'ZE + ZE',
            pairs() {
                const list = [];
                for (let a = 11; a <= 99; a++) {
                    for (let b = 11; b <= 99; b++) {
                        if (a % 10 === 0 || b % 10 === 0) continue;
                        if (a % 10 + b % 10 > 9) continue;
                        if (a + b > 99) continue;
                        list.push({ a: a, b: b });
                    }
                }
                return list;
            }
        },
        {
            id: 'ze-plus-z',
            name: 'ZE + Z',
            pairs() {
                const list = [];
                for (let a = 11; a <= 99; a++) {
                    if (a % 10 === 0) continue;
                    for (let b = 10; a + b <= 99; b += 10) list.push({ a: a, b: b });
                }
                return list;
            }
        },
        {
            id: 'ze-plus-e',
            name: 'ZE + E',
            pairs() {
                const list = [];
                for (let a = 11; a <= 99; a++) {
                    if (a % 10 === 0) continue;
                    for (let b = 1; a % 10 + b <= 9; b++) list.push({ a: a, b: b });
                }
                return list;
            }
        }
    ];

    /* Wie viele Summanden stehen schon in der Gleichung, bevor aufgeloest wird?
       Pfeil nach links schaltet rotierend durch. Anders als auf den anderen
       Dienes-Seiten stehen hier zu Beginn beide Zahlen da, wie im Heft: es
       geht ums Rechnen, nicht ums Ablesen. */
    const PREFILLS = [
        { count: 2, name: 'beide Zahlen' },
        { count: 1, name: 'erste Zahl' },
        { count: 0, name: 'keine Zahl' }
    ];

    /* ------------------------------------------------------------------
       Aufgabenauswahl

       Wie auf der anderen Plus-Seite: erst das Ergebnis gleichverteilt aus
       einem Beutel ohne Zuruecklegen, dann eine seiner Zerlegungen. Sonst
       kaemen grosse Ergebnisse mit ihren vielen Zerlegungen viel zu oft dran.
       ------------------------------------------------------------------ */

    function shuffle(list) {
        for (let i = list.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            const tmp = list[i]; list[i] = list[j]; list[j] = tmp;
        }
        return list;
    }

    LEVELS.forEach((level) => {
        level.bySum = new Map();
        level.pairs().forEach((pair) => {
            const sum = pair.a + pair.b;
            if (!level.bySum.has(sum)) level.bySum.set(sum, []);
            level.bySum.get(sum).push(pair);
        });
        level.results = Array.from(level.bySum.keys());
        level.bag = [];
    });

    function drawTask(level, previous) {
        if (level.bag.length === 0) {
            level.bag = shuffle(level.results.slice());
            // Beim Nachfuellen darf das letzte Ergebnis nicht sofort wieder
            // als erstes kommen.
            const last = level.bag[level.bag.length - 1];
            if (previous && level.bag.length > 1 && last === previous.a + previous.b) {
                level.bag[level.bag.length - 1] = level.bag[0];
                level.bag[0] = last;
            }
        }

        const sum = level.bag.pop();
        const options = level.bySum.get(sum);
        let pair = options[Math.floor(Math.random() * options.length)];
        if (previous && options.length > 1 && pair.a === previous.a && pair.b === previous.b) {
            pair = options[Math.floor(Math.random() * options.length)];
        }
        return { a: pair.a, b: pair.b };
    }

    /* ------------------------------------------------------------------
       Dienes-Material zeichnen: je Summand eine Rasterzeile mit
       Zehnerzelle links und Einerzelle rechts.
       ------------------------------------------------------------------ */

    function el(tag, className) {
        const node = document.createElement(tag);
        if (className) node.className = className;
        return node;
    }

    function tensCell(n) {
        const cell = el('div', 'rods');
        for (let i = 0; i < Math.floor(n / 10); i++) cell.appendChild(el('div', 'rod'));
        return cell;
    }

    // Fuenferluecke zwischen den Einerwuerfeln, in Wuerfelbreiten.
    const FIVE_GAP = 0.35;

    function onesCell(n) {
        const cell = el('div', 'ones');
        for (let i = 0; i < n % 10; i++) {
            const cube = el('div', 'cube');
            // leicht unperfekt aneinandergelegt
            cube.style.setProperty('--rot', (Math.random() * 6 - 3).toFixed(2) + 'deg');
            cube.style.setProperty('--drop', (Math.random() * 0.12).toFixed(3));
            const shift = (Math.random() * 0.16 - 0.05).toFixed(3);
            // Kleine Luecke nach dem fuenften Wuerfel (Kraft der Fuenf),
            // schmaler als die zwischen den Stangen, damit die Reihe eine
            // Reihe bleibt.
            const gap = i === 5 ? FIVE_GAP : 0;
            cube.style.marginLeft = (i === 0 ? '0' : 'calc(var(--u) * ' + (Number(shift) + gap).toFixed(3) + ')');
            cell.appendChild(cube);
        }
        return cell;
    }

    const board = document.getElementById('board');

    function renderMaterial(task) {
        board.innerHTML = '';
        [task.a, task.b].forEach((n) => {
            board.appendChild(tensCell(n));
            board.appendChild(onesCell(n));
        });
        board.classList.remove('fade-in');
        void board.offsetWidth;
        board.classList.add('fade-in');
    }

    /* ------------------------------------------------------------------
       Ablauf

       Aufgedeckt wird in Gruppen: erst die Summanden, dann (wenn
       eingeblendet) Zehner extra und Einer extra, zuletzt die Summe. Die
       Zahlen in den Zwischenschritten gehoeren zu ihrem Summanden: wer 24
       sieht, sieht auch 20 und 4. Dort bleiben sie aber schwarz (aufgedeckt
       nur fett), weil Blau in den Zwischenschritten die Zehnerkarte ist.
       ------------------------------------------------------------------ */

    let levelIndex = 0;
    let prefillIndex = 0;
    let showSteps = false;
    let stepwise = false;
    let showMaterial = true;
    let currentTask = null;

    // Welche Gruppen sind bereits aufgedeckt (blau)? Vorgegebene Summanden
    // stehen hier nicht drin, die kommen aus der Vorgabe-Stufe.
    let revealed = new Set();

    // Zu welcher Gruppe gehoert jeder Platzhalter?
    const GROUP_OF = {
        a: 'a', aT: 'a', aE: 'a',
        b: 'b', bT: 'b', bE: 'b',
        sT: 'tens', sE: 'ones', sum: 'sum'
    };

    const slotEls = Array.from(document.querySelectorAll('.slot[data-part]'));
    const levelLabel   = document.getElementById('level-label');
    const stepsLabel   = document.getElementById('steps-label');
    const prefillLabel = document.getElementById('prefill-label');
    const revealLabel  = document.getElementById('reveal-label');
    const materialLabel = document.getElementById('material-label');

    function values() {
        const a = currentTask.a;
        const b = currentTask.b;
        const tens = (n) => Math.floor(n / 10) * 10;
        return {
            a: a, aT: tens(a), aE: a % 10,
            b: b, bT: tens(b), bE: b % 10,
            sT: tens(a) + tens(b), sE: a % 10 + b % 10, sum: a + b
        };
    }

    function revealOrder() {
        return showSteps ? ['a', 'b', 'tens', 'ones', 'sum'] : ['a', 'b', 'sum'];
    }

    /* Welche Summanden sind durch die Vorgabe-Stufe schon gefuellt? */
    function isGiven(group) {
        const count = PREFILLS[prefillIndex].count;
        return (group === 'a' && count >= 1) || (group === 'b' && count >= 2);
    }

    /* ------------------------------------------------------------------
       Zahlenkarten wie im Heft: blaue Zehnerkarte (z. B. 80), rote
       Einerkarte (9). Im Endergebnis deckt die rote Karte die Null der
       blauen zu, leicht nach rechts unten verschoben - so sieht man, warum
       aus 80 und 9 die 89 wird und nicht 809.
       Jede Ziffer steht in einer festen Zelle, damit die rote Karte genau
       ueber der Einerstelle landet, egal wie breit die Ziffern sind.
       ------------------------------------------------------------------ */

    function card(n, kind) {
        const cells = String(n).split('')
            .map((d) => '<span class="digit">' + d + '</span>').join('');
        return '<span class="card ' + kind + '">' + cells + '</span>';
    }

    function stackedCards(sum) {
        // Vorgelesen wird die Zahl, nicht "40 9".
        return '<span class="card-stack" role="img" aria-label="' + sum + '">' +
               card(Math.floor(sum / 10) * 10, 'card-z') +
               card(sum % 10, 'card-e') +
               '</span>';
    }

    /* Welche Platzhalter zeigen Karten statt Ziffern? Nur mit
       eingeblendeten Zwischenschritten; ohne sie bleibt alles wie gewohnt. */
    function cardFor(part, v) {
        if (!showSteps) return null;
        if (part === 'sT') return card(v.sT, 'card-z');
        if (part === 'sE') return card(v.sE, 'card-e');
        if (part === 'sum') return stackedCards(v.sum);
        return null;
    }

    /* Zeichnet alle Platzhalter aus dem Zustand neu: vorgegebene Zahlen
       schwarz, aufgedeckte blau, der Rest leer. Nur die Gruppen in `fresh`
       blenden sanft ein. */
    function renderSlots(fresh) {
        const v = values();
        slotEls.forEach((slot) => {
            const part = slot.dataset.part;
            const group = GROUP_OF[part];
            const given = isGiven(group);
            const show = given || revealed.has(group);
            const html = show ? cardFor(part, v) : null;
            if (html) slot.innerHTML = html;
            else slot.textContent = show ? String(v[part]) : '';
            slot.classList.toggle('as-card', !!html);
            slot.classList.toggle('solved', show && !given);
            slot.classList.remove('fade-in');
            if (show && fresh && fresh.indexOf(group) !== -1) {
                void slot.offsetWidth;
                slot.classList.add('fade-in');
                // Die rote Karte rutscht sichtbar auf die Null.
                const onTop = slot.querySelector('.card-stack .card.card-e');
                if (onTop) onTop.classList.add('slide-in');
            }
        });
    }

    /* Noch offene Gruppen in Aufdeckreihenfolge. Entscheidend ist der
       tatsaechliche Zustand, nicht die Zahl der Tastendruecke - deshalb
       stimmt die Anzahl der Schritte bei jeder Vorgabe-Stufe automatisch. */
    function openGroups() {
        return revealOrder().filter((g) => !isGiven(g) && !revealed.has(g));
    }

    /* Ein Druck auf Pfeil nach rechts: schrittweise nur die naechste offene
       Gruppe, sonst alle auf einmal. Schon sichtbare Zahlen werden nie neu
       eingeblendet, damit das Tafelbild nicht springt. */
    function reveal() {
        const open = openGroups();
        const now = stepwise ? open.slice(0, 1) : open;
        now.forEach((g) => revealed.add(g));
        renderSlots(now);
    }

    function newTask() {
        currentTask = drawTask(LEVELS[levelIndex], currentTask);
        renderMaterial(currentTask);
        revealed = new Set();
        renderSlots(null);
    }

    function updateLabels() {
        levelLabel.textContent   = LEVELS[levelIndex].name;
        stepsLabel.textContent   = showSteps ? 'an' : 'aus';
        prefillLabel.textContent = PREFILLS[prefillIndex].name;
        revealLabel.textContent  = stepwise ? 'schrittweise' : 'alles auf einmal';
        document.body.classList.toggle('show-steps', showSteps);
        materialLabel.textContent = showMaterial ? 'sichtbar' : 'ausgeblendet';
        document.body.classList.toggle('no-material', !showMaterial);
    }

    window.addEventListener('keydown', (e) => {
        // Die Leertaste wirkt wie Pfeil nach rechts: Sie ist der reflexhafte
        // Weiter-Knopf und der Vorwaertsknopf vieler Praesentationsfernbedienungen.
        const forward = e.key === 'ArrowRight' || e.key === ' ' || e.key === 'Spacebar';

        if (forward) {
            e.preventDefault();
            if (openGroups().length === 0) newTask();
            else reveal();
        } else if (e.key === 'ArrowUp') {
            e.preventDefault();
            levelIndex = (levelIndex + 1) % LEVELS.length;
            updateLabels();
            currentTask = null;
            newTask();
        } else if (e.key === 'ArrowDown') {
            e.preventDefault();
            // Die Aufgabe bleibt stehen. Kommen die Zwischenschritte erst
            // nach der Loesung dazu, deckt der naechste Druck auf Pfeil nach
            // rechts sie auf, statt gleich weiterzublaettern.
            showSteps = !showSteps;
            updateLabels();
            renderSlots(null);
        } else if (e.key === 'ArrowLeft') {
            e.preventDefault();
            // Vorgabe umschalten; die Aufgabe bleibt stehen. Was schon
            // aufgedeckt war, bleibt sichtbar und wechselt nur die Farbe.
            prefillIndex = (prefillIndex + 1) % PREFILLS.length;
            updateLabels();
            renderSlots(null);
        } else if (e.key.toLowerCase() === 's') {
            // Buchstabe statt Sondertaste: Auf iPad-Huellentastaturen sitzen
            // gerade die Sondertasten an ungewohnten Stellen.
            e.preventDefault();
            stepwise = !stepwise;
            updateLabels();
        } else if (e.key.toLowerCase() === 'm') {
            // Gilt fuer alle folgenden Aufgaben, bis M wieder gedrueckt wird.
            e.preventDefault();
            showMaterial = !showMaterial;
            updateLabels();
        }
    });

    updateLabels();
    newTask();
    </script>
<script>
/* Handy-Vorschau: Wischen wirkt wie die Pfeiltaste in Wischrichtung
   (nach links wischen = weiter, wie beim Blaettern), und Tastenhinweise
   mit data-key sind antippbar. Beides loest dieselbe Taste aus wie die
   Tastatur, damit die Belegung nicht auseinanderlaufen kann. Bewusst
   ohne sichtbaren Hinweis; am Beamer aendert sich nichts. */
(function () {
    function taste(key) {
        document.dispatchEvent(new KeyboardEvent('keydown',
            { key: key, bubbles: true, cancelable: true }));
    }
    var start = null;
    window.addEventListener('touchstart', function (e) {
        start = e.touches.length === 1
            ? { x: e.touches[0].clientX, y: e.touches[0].clientY } : null;
    }, { passive: true });
    window.addEventListener('touchmove', function (e) {
        if (e.touches.length > 1) start = null;   // Zwei Finger zoomen.
    }, { passive: true });
    window.addEventListener('touchend', function (e) {
        if (!start) return;
        var dx = e.changedTouches[0].clientX - start.x;
        var dy = e.changedTouches[0].clientY - start.y;
        start = null;
        if (Math.max(Math.abs(dx), Math.abs(dy)) < 40) return;
        if (Math.abs(dx) > Math.abs(dy)) taste(dx < 0 ? 'ArrowRight' : 'ArrowLeft');
        else taste(dy < 0 ? 'ArrowUp' : 'ArrowDown');
    });
    document.querySelectorAll('[data-key]').forEach(function (el) {
        el.addEventListener('click', function () { taste(el.dataset.key); });
    });
})();
</script>
</body>
</html>
